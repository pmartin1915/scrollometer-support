<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Shortless check</title>
  <style>
    :root { color-scheme: light dark; --bg: #EEF1F5; --raised: #FBFCFD; --text: #101820; --secondary: #4A5563; --ok: #1F7A4D; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0B0F14; --raised: #131A22; --text: #EDF2F7; --secondary: #9AAAB8; --ok: #5FD39A; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 34rem; margin: 0 auto; padding: 48px 16px; }
    .card { background: var(--raised); border-radius: 16px; padding: 24px; }
    h1 { font-size: 1.4rem; margin: 0 0 12px; }
    p { margin: 0 0 12px; color: var(--secondary); }
    #shortless-status { color: var(--text); font-weight: 600; }
    html[data-shortless="on"] #shortless-status { color: var(--ok); }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Shortless check</h1>
      <p id="shortless-status">Shortless has not answered on this page yet.</p>
      <p>If it stays like this: open Settings &gt; Apps &gt; Safari &gt; Extensions, tap Shortless, turn it on, and allow the listed websites. Then reload this page.</p>
      <p>This page must be open in Safari. Shortless cannot run in other browsers.</p>
    </div>
  </main>
</body>
</html>
